name: Build APK (Play Store Ready)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions required for artifact upload
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout code
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 2. JDK 17 - required for Android
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Gradle wrapper (official action)
    - name: Setup Gradle
      uses: gradle/wrapper-gradle-action@v3

    # 4. Build debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    # 5. Upload APK as artifact (required for Play Store)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: emnger-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7