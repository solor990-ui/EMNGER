name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create gradle wrapper
      uses: gradle/wrapper-gradle-action@v3
      with:
        gradle-version: 8.5

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon -q

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EMNGER-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30